    note: '오르는 종목을 따라 사는 기준으로, 터틀 매매법으로 알려져 있습니다. 비싸 보일 때 사야 해서 따르기 어렵고, 돌파가 실패하면 바로 손실이 납니다.' },
];
// 한 기준을 지난 자료에 그대로 적용한다. 조건이 나온 날의 종가로 사고판 것으로 계산하고, 수수료·세금은 넣지 않는다.
function stockRuleRun(it, ind, id) {
  const { h, l, c } = it, n = c.length, st = Math.min(60, n - 1);
  const ok = (x, y, k) => x[k - 1] != null && y[k - 1] != null && x[k] != null && y[k] != null;
  const up = (x, y, k) => ok(x, y, k) && x[k - 1] <= y[k - 1] && x[k] > y[k];
  const dn = (x, y, k) => ok(x, y, k) && x[k - 1] >= y[k - 1] && x[k] < y[k];
  let pos = null, eq = 1, wins = 0;
  const trades = [], marks = [];
  for (let k = st; k < n; k++) {
    let s = null;
    if (id === 'ma') s = up(ind.ma[5], ind.ma[20], k) ? 'buy' : dn(ind.ma[5], ind.ma[20], k) ? 'sell' : null;
    else if (id === 'macd') s = up(ind.macd.line, ind.macd.sig, k) ? 'buy' : dn(ind.macd.line, ind.macd.sig, k) ? 'sell' : null;
    else if (id === 'rsi') { const a0 = ind.rsi[k - 1], a1 = ind.rsi[k]; if (a0 != null && a1 != null) s = a0 < 30 && a1 >= 30 ? 'buy' : a0 > 70 && a1 <= 70 ? 'sell' : null; }
    else if (id === 'brk' && k >= 20) s = c[k] > TA.hi(h, 20, k - 1) ? 'buy' : c[k] < TA.lo(l, 10, k - 1) ? 'sell' : null;
    if (s === 'buy' && !pos) { pos = { k, price: c[k] }; marks.push({ k, s }); }
    else if (s === 'sell' && pos) { const r = c[k] / pos.price - 1; trades.push({ a: pos.k, b: k, r }); eq *= 1 + r; if (r > 0) wins++; pos = null; marks.push({ k, s }); }
  }
  const last = c[n - 1], openR = pos ? last / pos.price - 1 : null;
  const lastSell = trades.length ? trades[trades.length - 1].b : null;
  return { marks, trades, wins, pos, openR, lastSell, days: n - 1 - st,
    total: (eq * (pos ? 1 + openR : 1) - 1) * 100, hold: (last / c[st] - 1) * 100,
    today: pos && pos.k === n - 1 ? 'buy' : lastSell === n - 1 ? 'sell' : null };
}

// --- 자료 읽기 ---
function stockValidItem(it) {
  if (!it || typeof it.id !== 'string' || typeof it.name !== 'string' || !Array.isArray(it.d)) return false;
  const n = it.d.length;
  if (n < 30 || n > 2000) return false;
  return ['o', 'h', 'l', 'c', 'v'].every(k => Array.isArray(it[k]) && it[k].length === n && it[k].every(x => typeof x === 'number' && isFinite(x)))
    && it.d.every(x => typeof x === 'string' && /^\d{8}$/.test(x));
}
function stockApply(data) {
  const items = (data && Array.isArray(data.items)) ? data.items.filter(stockValidItem).slice(0, 80) : [];
  stockData = items.length ? { updated_at: typeof data.updated_at === 'string' ? data.updated_at : '', source: typeof data.source === 'string' ? data.source : '', items } : null;
  items.forEach(it => { it._a = null; });
}
function stockLoad() {
  try { const saved = JSON.parse(localStorage.getItem('stocksData') || 'null'); if (saved) stockApply(saved); } catch (e) {}
  // 앱과 함께 올라온 파일과 저장소의 원본 파일을 둘 다 보고, 더 새로운 쪽을 쓴다 (앱 배포가 늦어도 시세는 최신으로)
  ['./stocks-data.json', STOCK_RAW_URL].forEach(url => {
    fetch(url, { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).then(data => {
      if (!data || !Array.isArray(data.items) || typeof data.updated_at !== 'string') return;
      if (stockData && stockData.updated_at >= data.updated_at) return; // 이미 같은 것이나 더 새 것을 갖고 있다
      stockApply(data);
      if (!stockData) return;
      try { localStorage.setItem('stocksData', JSON.stringify(data)); } catch (e) {}
      const slot = $('#hm-stocks'); if (slot) slot.innerHTML = stockHomeHTML();
      if (currentPage === 'stocks' && !appBusy()) renderPage();
    }).catch(() => {});
  });
  dbGetAll('memos').then(list => { stockCfg = list.filter(m => m.kind === 'stockcfg').sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''))[0] || null; const slot = $('#hm-stocks'); if (slot) slot.innerHTML = stockHomeHTML(); }).catch(() => {});
}
function stockItem(id) { return stockData ? stockData.items.find(it => it.id === id) || null : null; }
function stockFmt(v, it) {
  if (v == null || !isFinite(v)) return '-';
  const dec = (it.cur === 'KRW' && it.kind !== 'index') ? 0 : 2;
  return v.toLocaleString('ko-KR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function stockDate(d) { return `${Number(d.slice(4, 6))}/${Number(d.slice(6, 8))}`; }

// --- 지표 계산 (모두 배열을 받아 같은 길이의 배열을 돌려준다. 계산할 수 없는 자리는 null) ---
const TA = {
  sma(a, n) { const out = []; let s = 0; for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; out.push(i >= n - 1 ? s / n : null); } return out; },
  ema(a, n, from) { // from: 계산을 시작할 자리 (앞쪽이 null 인 배열용)
    const out = new Array(a.length).fill(null), st = from || 0;
    if (a.length < st + n) return out;
    let e = 0; for (let i = st; i < st + n; i++) e += a[i]; e /= n; out[st + n - 1] = e;
    const k = 2 / (n + 1);
    for (let i = st + n; i < a.length; i++) { e = a[i] * k + e * (1 - k); out[i] = e; }
    return out;
  },
  wilder(a, n, from) { // 와일더 평균 (RSI, ATR, ADX 에 쓰는 방식)
    const out = new Array(a.length).fill(null), st = from || 0;
    if (a.length < st + n) return out;
    let e = 0; for (let i = st; i < st + n; i++) e += a[i]; e /= n; out[st + n - 1] = e;
    for (let i = st + n; i < a.length; i++) { e = (e * (n - 1) + a[i]) / n; out[i] = e; }
    return out;
  },
  rsi(c, n) {
    const up = [0], dn = [0];
    for (let i = 1; i < c.length; i++) { const d = c[i] - c[i - 1]; up.push(d > 0 ? d : 0); dn.push(d < 0 ? -d : 0); }
    const au = TA.wilder(up, n, 1), ad = TA.wilder(dn, n, 1);
    return c.map((_, i) => (au[i] == null ? null : (ad[i] === 0 ? 100 : 100 - 100 / (1 + au[i] / ad[i]))));
  },
  macd(c) {
    const e12 = TA.ema(c, 12), e26 = TA.ema(c, 26);
    const line = c.map((_, i) => (e12[i] == null || e26[i] == null ? null : e12[i] - e26[i]));
    const first = line.findIndex(x => x != null);
    const sig = first < 0 ? line.map(() => null) : TA.ema(line.map(x => (x == null ? 0 : x)), 9, first);
    return { line, sig, hist: line.map((x, i) => (x == null || sig[i] == null ? null : x - sig[i])) };
  },
  boll(c, n, k) {
    const mid = TA.sma(c, n), up = [], lo = [];
    for (let i = 0; i < c.length; i++) {
      if (mid[i] == null) { up.push(null); lo.push(null); continue; }
      let s = 0; for (let j = i - n + 1; j <= i; j++) s += (c[j] - mid[i]) * (c[j] - mid[i]);
      const sd = Math.sqrt(s / n); up.push(mid[i] + k * sd); lo.push(mid[i] - k * sd);
    }
    return { mid, up, lo };
  },
  hi(a, n, i) { let m = -Infinity; for (let j = Math.max(0, i - n + 1); j <= i; j++) if (a[j] > m) m = a[j]; return m; },
  lo(a, n, i) { let m = Infinity; for (let j = Math.max(0, i - n + 1); j <= i; j++) if (a[j] < m) m = a[j]; return m; },
  stoch(h, l, c) { // 스토캐스틱 슬로우 (14, 3, 3)
    const raw = c.map((x, i) => { if (i < 13) return null; const hh = TA.hi(h, 14, i), ll = TA.lo(l, 14, i); return hh === ll ? 50 : (x - ll) / (hh - ll) * 100; });
    const avg3 = a => a.map((x, i) => (i < 2 || a[i - 2] == null || a[i - 1] == null || x == null ? null : (a[i - 2] + a[i - 1] + x) / 3));
    const k = avg3(raw); return { k, d: avg3(k) };
  },
  atr(h, l, c, n) {
    const tr = c.map((_, i) => (i === 0 ? h[0] - l[0] : Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1]))));
    return TA.wilder(tr, n, 1);
  },
  adx(h, l, c, n) { // 추세 강도. +DI, -DI 도 함께
    const tr = [0], pdm = [0], mdm = [0];
    for (let i = 1; i < c.length; i++) {
      const upMove = h[i] - h[i - 1], dnMove = l[i - 1] - l[i];
      pdm.push(upMove > dnMove && upMove > 0 ? upMove : 0);
      mdm.push(dnMove > upMove && dnMove > 0 ? dnMove : 0);
      tr.push(Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])));
    }
    const atr = TA.wilder(tr, n, 1), sp = TA.wilder(pdm, n, 1), sm = TA.wilder(mdm, n, 1);
    const pdi = c.map((_, i) => (atr[i] ? sp[i] / atr[i] * 100 : null)), mdi = c.map((_, i) => (atr[i] ? sm[i] / atr[i] * 100 : null));
    const dx = c.map((_, i) => (pdi[i] == null || mdi[i] == null ? null : (pdi[i] + mdi[i] === 0 ? 0 : Math.abs(pdi[i] - mdi[i]) / (pdi[i] + mdi[i]) * 100)));
    const first = dx.findIndex(x => x != null);
    const adx = first < 0 ? dx.map(() => null) : TA.wilder(dx.map(x => (x == null ? 0 : x)), n, first);
    return { adx, pdi, mdi };
  },
  obv(c, v) { const out = [0]; for (let i = 1; i < c.length; i++) out.push(out[i - 1] + (c[i] > c[i - 1] ? v[i] : c[i] < c[i - 1] ? -v[i] : 0)); return out; },
  ichimoku(h, l) { // 일목균형표: 전환선(9), 기준선(26), 선행스팬(26일 앞에 그림)
    const mid = (n, i) => (i < n - 1 ? null : (TA.hi(h, n, i) + TA.lo(l, n, i)) / 2);
    const ten = h.map((_, i) => mid(9, i)), kij = h.map((_, i) => mid(26, i));
    const a = h.map((_, i) => (i < 26 || ten[i - 26] == null || kij[i - 26] == null ? null : (ten[i - 26] + kij[i - 26]) / 2));
    const b = h.map((_, i) => (i < 26 ? null : mid(52, i - 26)));
    return { ten, kij, a, b };
  },
};

// --- 한 종목 분석: 지표 값, 점검표, 눈에 띄는 변화, 지지·저항 ---
function stockAnalyze(it) {
  if (it._a) return it._a;
  const { o, h, l, c, v } = it, n = c.length, i = n - 1, p = i - 1;
  const ma = {}; STOCK_MA.forEach(([k]) => { ma[k] = TA.sma(c, k); });
  const rsi = TA.rsi(c, 14), macd = TA.macd(c), bb = TA.boll(c, 20, 2), st = TA.stoch(h, l, c), atr = TA.atr(h, l, c, 14);
  const adx = TA.adx(h, l, c, 14), obv = TA.obv(c, v), ich = TA.ichimoku(h, l), vma = TA.sma(v, 20);
  const last = c[i], prev = c[p], chg = last - prev, pct = prev ? chg / prev * 100 : 0;
  const f = x => stockFmt(x, it), r1 = x => (Math.round(x * 10) / 10).toLocaleString('ko-KR');
  const rows = [], events = [];
  const crossUp = (a, b) => a[p] != null && b[p] != null && a[i] != null && b[i] != null && a[p] <= b[p] && a[i] > b[i];
  const crossDn = (a, b) => a[p] != null && b[p] != null && a[i] != null && b[i] != null && a[p] >= b[p] && a[i] < b[i];

  // 1) 이동평균 배열
  if (ma[60][i] != null) {
    const m5 = ma[5][i], m20 = ma[20][i], m60 = ma[60][i], m120 = ma[120][i];
    const full = m120 != null;
    const upOrder = m5 > m20 && m20 > m60 && (!full || m60 > m120), dnOrder = m5 < m20 && m20 < m60 && (!full || m60 < m120);
    const side = upOrder ? 'up' : dnOrder ? 'down' : (last > m20 && last > m60 ? 'up' : last < m20 && last < m60 ? 'down' : 'flat');
    rows.push({ title: '이동평균선', value: upOrder ? '정배열' : dnOrder ? '역배열' : '혼조', side,
      text: upOrder ? '짧은 기간의 평균선이 긴 기간의 평균선 위에 차례로 놓여 있습니다.' : dnOrder ? '짧은 기간의 평균선이 긴 기간의 평균선 아래에 차례로 놓여 있습니다.' : `주가가 20일선(${f(m20)}) ${last >= m20 ? '위' : '아래'}, 60일선(${f(m60)}) ${last >= m60 ? '위' : '아래'}에 있습니다.`,
      note: '정배열은 보통 오름세가 이어지는 모습으로, 역배열은 내림세가 이어지는 모습으로 봅니다.' });
    if (crossUp(ma[20], ma[60])) events.push('20일선이 60일선을 위로 넘었습니다 (중기 골든크로스)');
    if (crossDn(ma[20], ma[60])) events.push('20일선이 60일선 아래로 내려갔습니다 (중기 데드크로스)');
    if (crossUp(c, ma[20])) events.push('주가가 20일선 위로 올라섰습니다');
    if (crossDn(c, ma[20])) events.push('주가가 20일선 아래로 내려갔습니다');
    if (crossUp(c, ma[60])) events.push('주가가 60일선 위로 올라섰습니다');
    if (crossDn(c, ma[60])) events.push('주가가 60일선 아래로 내려갔습니다');
  }
  // 2) 일목균형표
  if (ich.a[i] != null && ich.b[i] != null) {
    const top = Math.max(ich.a[i], ich.b[i]), bot = Math.min(ich.a[i], ich.b[i]);
    const side = last > top ? 'up' : last < bot ? 'down' : 'flat';
    rows.push({ title: '일목균형표', value: side === 'up' ? '구름 위' : side === 'down' ? '구름 아래' : '구름 안', side,
      text: `구름대는 ${f(bot)} ~ ${f(top)}이고, 전환선(${f(ich.ten[i])})이 기준선(${f(ich.kij[i])}) ${ich.ten[i] >= ich.kij[i] ? '위' : '아래'}에 있습니다.`,
      note: '주가가 구름 위에 있으면 오름세, 아래에 있으면 내림세로 보고, 구름 안은 방향이 뚜렷하지 않은 구간으로 봅니다.' });
    const pt = Math.max(ich.a[p], ich.b[p]), pb = Math.min(ich.a[p], ich.b[p]);
    if (ich.a[p] != null && prev <= pt && last > top) events.push('주가가 일목균형표 구름대 위로 올라섰습니다');
    if (ich.a[p] != null && prev >= pb && last < bot) events.push('주가가 일목균형표 구름대 아래로 내려갔습니다');
  }
  // 3) 추세 강도 (ADX)
  if (adx.adx[i] != null) {
    const a = adx.adx[i], side = adx.pdi[i] > adx.mdi[i] ? 'up' : adx.pdi[i] < adx.mdi[i] ? 'down' : 'flat';
    rows.push({ title: '추세 강도 (ADX)', value: r1(a), side: a >= 20 ? side : 'flat',
      text: `${a >= 25 ? '추세가 뚜렷한 편입니다' : a >= 20 ? '추세가 생기는 단계로 봅니다' : '추세가 약한 편입니다'}. 상승 방향 힘(+DI ${r1(adx.pdi[i])})이 하락 방향 힘(-DI ${r1(adx.mdi[i])})보다 ${adx.pdi[i] >= adx.mdi[i] ? '큽니다' : '작습니다'}.`,
      note: 'ADX는 방향이 아니라 추세의 세기를 봅니다. 보통 25 이상이면 추세가 뚜렷하고 20 아래면 횡보로 봅니다.' });
  }
  // 4) MACD
  if (macd.hist[i] != null) {
    const side = macd.line[i] > macd.sig[i] ? 'up' : 'down';
    rows.push({ title: 'MACD', value: side === 'up' ? '시그널 위' : '시그널 아래', side,
      text: `MACD가 시그널선 ${side === 'up' ? '위' : '아래'}에 있고, 기준선(0) ${macd.line[i] >= 0 ? '위' : '아래'}입니다.`,
      note: 'MACD가 시그널선 위에 있으면 오르는 힘이, 아래에 있으면 내리는 힘이 우세한 것으로 봅니다.' });
  }
  // 5) RSI

window.stockSaveTarget = async function() {
  const it = stockItem(stockSel);
  if (!it) return;
  const num = id => { const x = parseFloat(($('#' + id).value || '').trim()); return isFinite(x) && x > 0 ? x : null; };
  const above = num('st-above'), below = num('st-below'), cost = num('st-cost');
  if (above != null && below != null && below >= above) { toast('"이하" 가격은 "이상" 가격보다 낮아야 합니다'); return; }
  const list = (await dbGetAll('memos')).filter(m => m.kind === 'stockcfg').sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
  const cfg = list[0] || { kind: 'stockcfg', title: '증권 차트 설정', content: '', targets: {} };
  cfg.targets = Object.assign({}, cfg.targets || {});
  const none = above == null && below == null && cost == null;
  if (none) delete cfg.targets[it.id]; else cfg.targets[it.id] = { above, below, cost };
  stockCfg = cfg.id ? await dbPut('memos', cfg) : await dbAdd('memos', cfg);
  toast(none ? '적어 둔 가격을 지웠습니다' : '저장했습니다');
  renderStockDetail();
};

// --- 차트 그리기 (SVG): 봉 + 이동평균(+볼린저, 일목) / 거래량 / RSI / MACD ---
function stockDrawChart() {
  const it = stockItem(stockSel), box = $('#st-chart');
  if (!it || !box) return;
  const a = stockAnalyze(it), p = stockPrefs();
  const N = it.c.length, n = Math.min(p.range, N), s0 = N - n;
  const W = Math.max(200, Math.floor(box.getBoundingClientRect().width / uiZoomNow())), padR = Math.max(40, stockFmt(Math.max(...it.h), it).length * 5.6 + 10), plotW = W - padR, bw = plotW / n;
  const H1 = 230, H2 = 54, H3 = 60, H4 = 60, gap = 14, y2 = H1 + gap, y3 = y2 + H2 + gap, y4 = y3 + H3 + gap, H = y4 + H4 + 18;
  const X = k => (k - s0 + 0.5) * bw;
  const vis = arr => arr.slice(s0);
  const nums = arr => vis(arr).filter(x => x != null);
  let lo = Math.min(...vis(it.l)), hi = Math.max(...vis(it.h));
  const over = [];
  if (p.boll) over.push(a.bb.up, a.bb.lo);
  if (p.ichi) over.push(a.ich.a, a.ich.b);
  over.forEach(arr => { const x = nums(arr); if (x.length) { lo = Math.min(lo, ...x); hi = Math.max(hi, ...x); } });
  const rule = a.rules.find(x => x.rule.id === p.rule);
  const padY = (hi - lo) * (rule ? 0.09 : 0.05) || hi * 0.01; lo -= padY; hi += padY;
  const Y = v => (hi - v) / (hi - lo) * H1;
  const line = (arr, color, w, yf, dash) => {
    let d = '', pen = false;
    for (let k = s0; k < N; k++) { if (arr[k] == null) { pen = false; continue; } d += (pen ? 'L' : 'M') + X(k).toFixed(1) + ' ' + yf(arr[k]).toFixed(1); pen = true; }
    return d ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}"${dash ? ' stroke-dasharray="3 3"' : ''}/>` : '';
  };
  let g = '';
  // 가격 눈금
  for (let q = 0; q <= 4; q++) { const v = lo + (hi - lo) * q / 4, y = Y(v); g += `<line x1="0" x2="${plotW}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border-light)"/><text x="${plotW + 4}" y="${Math.max(8, y + 3).toFixed(1)}" class="st-ax">${stockFmt(v, it)}</text>`; }
  // 달 표시
  let lastM = '';
  for (let k = s0; k < N; k++) { const m = it.d[k].slice(4, 6); if (m !== lastM) { if (lastM && X(k) < plotW - 18) g += `<line x1="${X(k).toFixed(1)}" x2="${X(k).toFixed(1)}" y1="0" y2="${H - 16}" stroke="var(--border-light)"/><text x="${(X(k) + 2).toFixed(1)}" y="${H - 4}" class="st-ax">${Number(m)}월</text>`; lastM = m; } }
  // 일목 구름
  if (p.ichi) {
    let top = '', bot = '';
    for (let k = s0; k < N; k++) { if (a.ich.a[k] == null || a.ich.b[k] == null) continue; top += `${top ? 'L' : 'M'}${X(k).toFixed(1)} ${Y(a.ich.a[k]).toFixed(1)}`; bot = `L${X(k).toFixed(1)} ${Y(a.ich.b[k]).toFixed(1)}` + bot; }
    if (top) g += `<path d="${top}${bot}Z" fill="rgba(112,72,232,0.10)" stroke="none"/>`;
    g += line(a.ich.ten, '#C2255C', 1, Y, true) + line(a.ich.kij, '#1098AD', 1, Y, true);
  }
  if (p.boll) g += line(a.bb.up, '#ADB5BD', 1, Y, true) + line(a.bb.lo, '#ADB5BD', 1, Y, true);
  // 봉
  const cw = Math.max(1, Math.min(9, bw * 0.7));
  for (let k = s0; k < N; k++) {
    const up = it.c[k] >= it.o[k], col = up ? STOCK_UP : STOCK_DOWN, x = X(k);
    g += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y(it.h[k]).toFixed(1)}" y2="${Y(it.l[k]).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
    if (cw >= 2) { const yt = Y(Math.max(it.o[k], it.c[k])), hb = Math.max(1, Y(Math.min(it.o[k], it.c[k])) - yt); g += `<rect x="${(x - cw / 2).toFixed(1)}" y="${yt.toFixed(1)}" width="${cw.toFixed(1)}" height="${hb.toFixed(1)}" fill="${col}"/>`; }
  }
  STOCK_MA.forEach(m => { g += line(a.ma[m[0]], m[1], 1.2, Y); });
  // 내가 산 가격
  const tg = (stockCfg && stockCfg.targets && stockCfg.targets[it.id]) || {};
  if (typeof tg.cost === 'number' && tg.cost > lo && tg.cost < hi) g += `<line x1="0" x2="${plotW}" y1="${Y(tg.cost).toFixed(1)}" y2="${Y(tg.cost).toFixed(1)}" stroke="var(--primary)" stroke-width="1" stroke-dasharray="5 3"/>`;
  // 고른 기준의 사는 날(▲) · 파는 날(▼)
  if (rule) rule.marks.forEach(m => {
    if (m.k < s0) return;
    const x = X(m.k), buy = m.s === 'buy', y = buy ? Y(it.l[m.k]) + 4 : Y(it.h[m.k]) - 4, d = buy ? 9 : -9;
    g += `<polygon points="${x.toFixed(1)},${y.toFixed(1)} ${(x - 5).toFixed(1)},${(y + d).toFixed(1)} ${(x + 5).toFixed(1)},${(y + d).toFixed(1)}" fill="${buy ? STOCK_UP : STOCK_DOWN}" stroke="var(--surface)" stroke-width="1"/>`;
  });
  // 거래량
  const vmax = Math.max(...vis(it.v), 1), VY = v => y2 + H2 - v / vmax * H2;
  for (let k = s0; k < N; k++) g += `<rect x="${(X(k) - cw / 2).toFixed(1)}" y="${VY(it.v[k]).toFixed(1)}" width="${cw.toFixed(1)}" height="${(y2 + H2 - VY(it.v[k])).toFixed(1)}" fill="${it.c[k] >= it.o[k] ? STOCK_UP : STOCK_DOWN}" opacity="0.55"/>`;
  g += line(a.vma, '#868E96', 1, VY) + `<text x="2" y="${y2 + 9}" class="st-ax">거래량</text>`;
  // RSI
  const RY = v => y3 + H3 - v / 100 * H3;
  g += `<rect x="0" y="${RY(70)}" width="${plotW}" height="${RY(30) - RY(70)}" fill="var(--bg)"/>` + [70, 30].map(v => `<line x1="0" x2="${plotW}" y1="${RY(v)}" y2="${RY(v)}" stroke="var(--border)" stroke-dasharray="3 3"/><text x="${plotW + 4}" y="${RY(v) + 3}" class="st-ax">${v}</text>`).join('');
  g += line(a.rsi, '#7048E8', 1.2, RY) + `<text x="2" y="${y3 + 9}" class="st-ax">RSI</text>`;
  // MACD
  const mh = nums(a.macd.hist).concat(nums(a.macd.line), nums(a.macd.sig)), mm = Math.max(...mh.map(Math.abs), 1e-9), MY = v => y4 + H4 / 2 - v / mm * (H4 / 2);
  g += `<line x1="0" x2="${plotW}" y1="${MY(0)}" y2="${MY(0)}" stroke="var(--border)"/>`;
  for (let k = s0; k < N; k++) { const v = a.macd.hist[k]; if (v == null) continue; const y = MY(Math.max(v, 0)); g += `<rect x="${(X(k) - cw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(0.5, Math.abs(MY(v) - MY(0))).toFixed(1)}" fill="${v >= 0 ? STOCK_UP : STOCK_DOWN}" opacity="0.5"/>`; }
  g += line(a.macd.line, '#212529', 1.1, MY) + line(a.macd.sig, '#F08C00', 1.1, MY) + `<text x="2" y="${y4 + 9}" class="st-ax">MACD</text>`;
  g += `<line id="st-cross" x1="0" x2="0" y1="0" y2="${H - 16}" stroke="var(--text-secondary)" stroke-dasharray="2 2" style="display:none"/>`;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:pan-y">${g}<rect x="0" y="0" width="${plotW}" height="${H - 16}" fill="transparent" onpointerdown="stockPoint(event)" onpointermove="stockPoint(event)"/></svg>`;
  stockView = { s0, n, bw, W };
  stockInfo(N - 1);
}
function stockInfo(k) {
  const it = stockItem(stockSel), el = $('#st-info');
  if (!it || !el || k < 0 || k >= it.c.length) return;
  const d = it.d[k], pc = k > 0 ? it.c[k - 1] : it.o[k], pct = pc ? (it.c[k] - pc) / pc * 100 : 0;
  el.innerHTML = `<b>${Number(d.slice(0, 4))}.${Number(d.slice(4, 6))}.${Number(d.slice(6, 8))}</b> 시 ${stockFmt(it.o[k], it)} · 고 ${stockFmt(it.h[k], it)} · 저 ${stockFmt(it.l[k], it)} · 종 <b>${stockFmt(it.c[k], it)}</b> <span style="color:${pct > 0 ? STOCK_UP : pct < 0 ? STOCK_DOWN : 'inherit'}">${pct > 0 ? '+' : ''}${pct.toFixed(2)}%</span> · 거래량 ${it.v[k].toLocaleString('ko-KR')}`;
}
window.stockPoint = function(ev) {
  if (!stockView) return;
  const svg = ev.currentTarget.ownerSVGElement, r = svg.getBoundingClientRect();
  const x = (ev.clientX - r.left) * (stockView.W / (r.width || stockView.W));
  const k = stockView.s0 + Math.max(0, Math.min(stockView.n - 1, Math.floor(x / stockView.bw)));
  const cross = $('#st-cross'), cx = (k - stockView.s0 + 0.5) * stockView.bw;
  if (cross) { cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.display = ''; }
  stockInfo(k);
};

// === SCHEDULE (월 달력) ===
// --- 반복 일정 ---
// 일정에 repeat('weekly' | 'monthly' | 'yearly')가 있으면 시작일을 기준으로 되풀이된다.
// 되풀이되는 날을 하나하나 저장하지 않고, 화면에 그릴 때 계산한다.
//   repeat_until : 반복 종료일 (없으면 계속)
//   done_dates   : 완료 체크한 회차의 시작일 목록 (회차마다 따로 체크)
//   skip_dates   : '이 날만 삭제'한 회차의 시작일 목록
const SCHED_REPEAT = { weekly: '매주', monthly: '매월', yearly: '매년' };
function schedDays(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
// ds(날짜)를 포함하는 회차의 시작일. 그날 해당이 없으면 null. 반복이 아닌 일정은 시작일을 그대로 돌려준다.
function schedOccStart(s, ds) {
  const start = s.date;
  if (!start || !ds) return null;
  const end = (s.end_date && s.end_date > start) ? s.end_date : start;
  if (!SCHED_REPEAT[s.repeat]) return (start <= ds && ds <= end) ? start : null;
  if (ds < start) return null;
  const span = schedDays(start, end); // 여러 날 일정이면 그 길이
  const fits = o => !!o && o >= start && o <= ds && schedDays(o, ds) <= span
    && (!s.repeat_until || o <= s.repeat_until) && !(s.skip_dates || []).includes(o);
  const y1 = Number(start.slice(0, 4)), m1 = Number(start.slice(5, 7)), y2 = Number(ds.slice(0, 4)), m2 = Number(ds.slice(5, 7));
  const cands = [];
  if (s.repeat === 'weekly') {
    const k = Math.floor(schedDays(start, ds) / 7);
    for (let i = k; i >= 0 && i >= k - Math.ceil(span / 7); i--) cands.push(ymdShift(start, { d: i * 7 }));
  } else if (s.repeat === 'monthly') {
    const k = (y2 - y1) * 12 + (m2 - m1);
    for (let i = k; i >= 0 && i >= k - 1 - Math.floor(span / 28); i--) cands.push(ymdShift(start, { m: i })); // 그 달에 없는 날(31일 등)은 건너뛴다
  } else {
    const k = y2 - y1;
    for (let i = k; i >= 0 && i >= k - 1; i--) cands.push(ymdShift(start, { y: i })); // 2월 29일은 윤년에만
  }
  return cands.find(fits) || null;
}
function coversDay(s, ds) { return !!schedOccStart(s, ds); }
// 그날(회차)의 일정을 완료했는가
function schedDone(s, ds) {
  if (!SCHED_REPEAT[s.repeat]) return !!s.completed;
  const o = schedOccStart(s, ds);
  return !!o && (s.done_dates || []).includes(o);
}
// 완료 체크를 켜고 끈다. 반복 일정은 그 회차만 바뀐다.
async function schedToggle(id, ds) {
  const item = await dbGet('schedules', id);
  if (!item) return;
  if (SCHED_REPEAT[item.repeat]) {
    const o = schedOccStart(item, ds);
    if (!o) return;
    const list = (item.done_dates || []).slice();
    const at = list.indexOf(o);
    if (at >= 0) list.splice(at, 1); else list.push(o);
    item.done_dates = list;
  } else {
    item.completed = item.completed ? 0 : 1;
  }
  await dbPut('schedules', item);
}
// "매주 월요일", "매월 16일", "매년 11월 16일"
function schedRepeatLabel(s) {
  if (!SCHED_REPEAT[s.repeat] || !s.date) return '';
  const d = new Date(s.date + 'T00:00:00');
  const what = s.repeat === 'weekly' ? '일월화수목금토'[d.getDay()] + '요일'
    : s.repeat === 'monthly' ? d.getDate() + '일'
    : (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  return SCHED_REPEAT[s.repeat] + ' ' + what;
}
// 반복 일정을 지울 때: 이 날만 지울지, 전체를 지울지 묻는다
function schedAskDelete(id, ds, back) {

// === 구글 캘린더 함께 보기 (읽기 전용) ===
// 구글 캘린더의 일정을 가져와 앱의 스케줄(월·주 보기)과 홈의 오늘 일정에 함께 보여준다.
// · 앱은 구글 캘린더를 읽기만 한다 (calendar.readonly). 고치거나 지우지 않는다.
// · 연결은 화면을 구글로 넘겼다가 돌아오는 방식이다. 팝업을 쓰지 않아 홈 화면 앱에서도 같은 방식으로 동작한다.
// · 구글이 내주는 열쇠(토큰)는 1시간짜리다. 가져온 일정은 기기에 저장해 두어, 열쇠가 끝난 뒤에도 마지막으로 가져온 내용이 보인다.
const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
const GCAL_BACK_DAYS = 60, GCAL_AHEAD_DAYS = 365; // 가져오는 범위: 오늘 기준 과거 60일 ~ 앞으로 1년
const GCAL_STALE_MS = 15 * 60 * 1000;             // 이보다 오래됐으면 스케줄을 열 때 다시 가져온다
let gcalBusy = false, gcalErr = '', gcalMem = null, gcalFailAt = 0;

function gcalOn() { try { return localStorage.getItem('gcalOn') === '1'; } catch (e) { return false; } }
function gcalRedirectUri() { return location.origin + location.pathname.replace(/[^/]*$/, ''); } // 예: https://chayoungdal.github.io/my-life/
function gcalToken() {
  try {
    const t = JSON.parse(localStorage.getItem('gcalToken') || 'null');
    return (t && t.t && t.exp > Date.now() + 30000) ? t.t : null;
  } catch (e) { return null; }
}
function gcalCache() {
  if (gcalMem) return gcalMem;
  try { gcalMem = JSON.parse(localStorage.getItem('gcalCache') || 'null'); } catch (e) { gcalMem = null; }
  return gcalMem;
}
// 화면에 함께 보여줄 구글 일정 (연결하지 않았으면 빈 목록)
function gcalEvents() {
  if (!gcalOn()) return [];
  const c = gcalCache();
  return (c && Array.isArray(c.events)) ? c.events : [];
}

// 구글로 넘어가 허락을 받고 돌아온다
window.gcalConnect = function() {
  const cid = cloudGetClientId();
  if (!cid) { toast('먼저 백업/복원에서 OAuth 클라이언트 ID를 저장하세요'); gcalHelp(); return; }
  const state = makeUuid();
  try {
    localStorage.setItem('gcalState', state);
    sessionStorage.setItem('appResume', JSON.stringify({ page: 'schedule', date: currentDate })); // 돌아오면 스케줄 화면으로
  } catch (e) {}
  const q = new URLSearchParams({
    client_id: cid, redirect_uri: gcalRedirectUri(), response_type: 'token',
    scope: GCAL_SCOPE, include_granted_scopes: 'true', state: 'gcal:' + state,
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + q.toString();
};
// 구글에서 돌아왔을 때: 주소 끝(#...)에 실려 온 열쇠를 꺼내고 주소에서 지운다
function gcalHandleReturn() {
  const hash = location.hash || '';
  if (!/[#&]state=gcal(%3A|:)/.test(hash)) return false;
  const p = new URLSearchParams(hash.replace(/^#/, ''));
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  let want = '';
  try { want = localStorage.getItem('gcalState') || ''; localStorage.removeItem('gcalState'); } catch (e) {}
  const state = (p.get('state') || '').replace(/^gcal:/, '');
  if (p.get('error')) { gcalErr = p.get('error') === 'access_denied' ? '연결을 취소했습니다' : '연결 실패: ' + p.get('error'); return true; }
  const token = p.get('access_token');
  if (!token || !want || state !== want) { gcalErr = '연결을 확인하지 못했습니다. 다시 시도해 주세요'; return true; }
  const sec = Math.max(60, parseInt(p.get('expires_in') || '3600', 10) || 3600);
  try {
    localStorage.setItem('gcalToken', JSON.stringify({ t: token, exp: Date.now() + sec * 1000 }));
    localStorage.setItem('gcalOn', '1');
  } catch (e) {}
  gcalErr = '';
  return true;
}

async function gcalApi(path, params) {
  const tk = gcalToken();
  if (!tk) throw Object.assign(new Error('token'), { code: 401 });
  const res = await fetch('https://www.googleapis.com/calendar/v3/' + path + '?' + new URLSearchParams(params).toString(), { headers: { Authorization: 'Bearer ' + tk } });
  if (!res.ok) {
    let msg = '';
    try { msg = ((await res.json()).error || {}).message || ''; } catch (e) {}
    throw Object.assign(new Error(msg || ('HTTP ' + res.status)), { code: res.status });
  }
  return res.json();
}
// 구글 일정 하나를 앱의 일정 모양으로 바꾼다 (g: 1 이 구글 일정 표시)
function gcalMap(ev, calName) {
  if (!ev || ev.status === 'cancelled') return null;
  const s = ev.start || {}, e = ev.end || {};
  let date, end, time = '';
  if (s.date) { // 종일 일정: 구글의 끝 날짜는 '다음 날'이라 하루를 뺀다
    date = s.date;
    end = e.date ? ymdShift(e.date, { d: -1 }) : s.date;
  } else if (s.dateTime) {
    const ds = new Date(s.dateTime), de = e.dateTime ? new Date(e.dateTime) : ds;
    if (isNaN(ds.getTime())) return null;
    date = toLocalYMD(ds);
    time = String(ds.getHours()).padStart(2, '0') + ':' + String(ds.getMinutes()).padStart(2, '0');
    end = isNaN(de.getTime()) ? date : toLocalYMD(de);
    if (end > date && de.getHours() === 0 && de.getMinutes() === 0) end = ymdShift(end, { d: -1 }); // 자정에 끝나면 전날까지
  } else return null;
  if (!end || end < date) end = date;
  return {
    g: 1, gid: String(ev.id || ''), title: ev.summary || '(제목 없음)', date, end_date: end !== date ? end : null, time,
    place: ev.location || '', note: String(ev.description || '').slice(0, 400), link: ev.htmlLink || '', cal: calName || '',
  };
}
async function gcalRefresh() {
  const today = toLocalYMD(new Date());
  const from = ymdShift(today, { d: -GCAL_BACK_DAYS }), to = ymdShift(today, { d: GCAL_AHEAD_DAYS });
  const list = await gcalApi('users/me/calendarList', { minAccessRole: 'reader', maxResults: 100 });
  // 구글 캘린더에서 켜 둔 캘린더만. 공휴일 캘린더는 앱에 이미 있어 뺀다.
  const cals = (list.items || []).filter(c => (c.selected || c.primary) && !/#holiday@group\.v\.calendar\.google\.com$/.test(c.id || '')).slice(0, 12);
  const events = [];
  for (const c of cals) {
    let pageToken = '', pages = 0;
    do {
      const params = { timeMin: new Date(from + 'T00:00:00').toISOString(), timeMax: new Date(to + 'T23:59:59').toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: 250 };
      if (pageToken) params.pageToken = pageToken;
      const r = await gcalApi('calendars/' + encodeURIComponent(c.id) + '/events', params);
      (r.items || []).forEach(ev => { const m = gcalMap(ev, c.summaryOverride || c.summary); if (m) events.push(m); });
      pageToken = r.nextPageToken || '';
    } while (pageToken && ++pages < 4);
  }
  gcalMem = { at: new Date().toISOString(), from, to, events };
  try { localStorage.setItem('gcalCache', JSON.stringify(gcalMem)); } catch (e) {} // 저장 공간이 모자라면 이번 실행 동안만 기억

function gcalExplain(err) {

  if (err && err.code === 403) return '구글 캘린더를 읽을 권한이 없습니다';
  return '구글 일정을 가져오지 못했습니다' + (msg && msg !== 'token' ? ' (' + msg.slice(0, 60) + ')' : '');
}
// 스케줄 화면을 열 때: 열쇠가 살아 있고 가져온 지 오래됐으면 조용히 다시 가져온다
function gcalMaybeRefresh(force) {

  if (!force && gcalFailAt && Date.now() - gcalFailAt < 5 * 60 * 1000) return; // 방금 실패했으면 5분 쉰다
  gcalBusy = true;
  gcalRefresh().then(() => { gcalFailAt = 0; }).catch(err => { gcalFailAt = Date.now(); gcalErr = gcalExplain(err); }).then(() => {
    gcalBusy = false;
    if ((currentPage === 'schedule' || currentPage === 'dashboard') && !appBusy()) renderPage();
  });
}

// 스케줄 보기 방식: 월(달력) 또는 주(하루 한 줄씩). 고른 방식은 기기에 기억한다.

// 좌우로 밀거나 화살표를 누르면: 월 보기에서는 한 달, 주 보기에서는 한 주씩 이동

};
window.changeWeek = function(dir) {
  const d = new Date(currentDate + 'T00:00:00');

};
async function renderScheduleWeek() {
  gcalMaybeRefresh();
  const all = (await dbGetAll('schedules')).concat(gcalEvents()).sort((x, y) => (x.time || '').localeCompare(y.time || ''));
  const base = new Date(currentDate + 'T00:00:00');
  const start = new Date(base.getFullYear(), base.getMonth(), base.getDate() - base.getDay()); // 그 주의 일요일
  const days = [];
  for (let i = 0; i < 7; i++) days.push(toLocalYMD(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i)));
  const todayStr = toLocalYMD(new Date());
  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
  const part = ds => ({ y: Number(ds.slice(0, 4)), m: Number(ds.slice(5, 7)), d: Number(ds.slice(8, 10)) });
  const a = part(days[0]), b = part(days[6]);
  const thisYear = new Date().getFullYear();
  const label = `${(a.y !== thisYear || b.y !== thisYear) ? a.y + '년 ' : ''}${a.m}월 ${a.d}일 ~ ${b.y !== a.y ? b.y + '년 ' : ''}${(b.m !== a.m || b.y !== a.y) ? b.m + '월 ' : ''}${b.d}일`;
  const md = ds => { const x = part(ds); return x.m + '/' + x.d; };
  if (currentPage !== 'schedule') return;
  $('#mainContent').innerHTML = `
    ${schedHeaderHTML()}
    <div class="cal-nav">
      <button class="btn-icon" onclick="changeWeek(-1)">&larr;</button>
      <span class="cal-month" style="white-space:nowrap;font-size:clamp(14px, 4.2vw, 17px)">${label}</span>
      <button class="btn-icon" onclick="changeWeek(1)">&rarr;</button>
      <button class="btn btn-sm btn-secondary" onclick="goToday()">오늘</button>
    </div>
    ${gcalBarHTML()}
    <div class="wk-list">
      ${days.map((ds, i) => {
        const items = all.filter(s => coversDay(s, ds));
        const hol = HOLIDAYS[ds];
        return `<div class="wk-day ${ds === todayStr ? 'today' : ''}">
          <div class="wk-date ${(i === 0 || hol) ? 'red' : ''}" onclick="openDay('${ds}')">
            <span class="wk-num">${part(ds).d}</span>
            <span class="wk-wd">${weekdays[i]}요일</span>
            ${hol ? `<span class="wk-hol">${esc(hol)}</span>` : ''}
          </div>
          <div class="wk-items">
            ${items.length ? items.map(s => {
              const occ = schedOccStart(s, ds) || s.date; // 반복 일정이면 이번 회차의 시작일
              const len = (s.end_date && s.end_date > s.date) ? schedDays(s.date, s.end_date) : 0;
              const span = len ? `${md(occ)}~${md(ymdShift(occ, { d: len }))}` : '';
              const meta = [schedRepeatLabel(s), span, s.g ? esc(s.place || '') : (s.description ? esc(s.description) : '')].filter(Boolean).join(' · ');
              if (s.g) return `<div class="wk-item">
                <span class="wk-time">${esc(s.time || '종일')}</span>
                <div class="wk-body" data-gid="${esc(s.gid)}" onclick="gcalShow(this.dataset.gid)">
                  <div class="wk-title">${esc(s.title)}</div>
                  ${meta ? `<div class="wk-meta">${meta}</div>` : ''}
                </div>
                <span class="gc-tag">구글</span>
              </div>`;
              return `<div class="wk-item ${schedDone(s, ds) ? 'done' : ''}">
                <span class="wk-time">${esc(s.time || '종일')}</span>
                <div class="wk-body" onclick="weekEdit(${s.id}, '${ds}')">
                  <div class="wk-title">${esc(s.title)}</div>
                  ${meta ? `<div class="wk-meta">${meta}</div>` : ''}
                </div>
                <span class="hm-check" onclick="weekToggle(${s.id}, '${ds}')">&#10003;</span>
              </div>`;
            }).join('') : ''}
            <div class="wk-foot">
              <span class="wk-none">${items.length ? '' : '일정 없음'}</span>
              <button class="wk-add" onclick="weekAdd('${ds}')">+ 추가</button>
            </div>
          </div>
        </div>`;
      }).join('')}

}

async function renderSchedule() {
  if (schedView() === 'week') return renderScheduleWeek();
  const all = await dbGetAll('schedules');
  const base = new Date(currentDate + 'T00:00:00');
  const year = base.getFullYear();
  const month = base.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = toLocalYMD(new Date());

  gcalMaybeRefresh();
  gcalEvents().forEach(e => all.push(e)); // 구글 캘린더 일정도 함께
  all.sort((x, y) => (x.time || '').localeCompare(y.time || ''));

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

  $('#mainContent').innerHTML = `
    ${schedHeaderHTML()}
    <div class="cal-nav">
      <button class="btn-icon" onclick="changeMonth(-1)">&larr;</button>
      <span class="cal-month">${year}년 ${month + 1}월</span>
      <button class="btn-icon" onclick="changeMonth(1)">&rarr;</button>
      <button class="btn btn-sm btn-secondary" onclick="goToday()">오늘</button>
    </div>
    ${gcalBarHTML()}
    <div class="cal-grid cal-head">
      ${weekdays.map((w, i) => `<div class="cal-weekday ${i === 0 ? 'sun' : ''} ${i === 6 ? 'sat' : ''}">${w}</div>`).join('')}
    </div>
    <div class="cal-grid">
      ${cells.map(d => {
        if (d === null) return `<div class="cal-cell empty"></div>`;
        const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const items = all.filter(s => coversDay(s, ds));
        const wd = new Date(year, month, d).getDay();
        const hol = HOLIDAYS[ds];
        return `<div class="cal-cell ${ds === todayStr ? 'today' : ''}" onclick="openDay('${ds}')">
          <div class="cal-daynum ${(wd === 0 || hol) ? 'sun' : ''} ${wd === 6 ? 'sat' : ''}">${d}</div>
          ${hol ? `<div class="cal-holiday">${hol}</div>` : ''}
          <div class="cal-items">
            ${items.slice(0, 3).map(s => `<div class="cal-event ${schedDone(s, ds) ? 'done' : ''} ${s.g ? 'g' : ''}">${s.time ? `<span class="cal-time">${esc(s.time)}</span> ` : ''}${esc(s.title)}</div>`).join('')}
            ${items.length > 3 ? `<div class="cal-more">+${items.length - 3}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

window.changeMonth = function(dir) {

  d.setMonth(d.getMonth() + dir);

};

window.dayToggle = async function(id, current, ds) {

window.dayDelete = async function(id, ds) {

window.saveSchedule = async function() {
  const idRaw = $('#f-id') && $('#f-id').value;
  const id = idRaw ? parseInt(idRaw) : null;
  const backDs = $('#f-back') && $('#f-back').value;
  const start = $('#f-date').value;
  let end = $('#f-end').value || null;
  if (end && end < start) end = start;
  const repeat = SCHED_REPEAT[$('#f-repeat').value] ? $('#f-repeat').value : '';
  let until = repeat ? ($('#f-until').value || null) : null;
  if (until && until < start) until = null; // 시작일보다 이른 종료일은 무시
  if (id) {
    const existing = await dbGet('schedules', id);
    if (existing) {
      existing.date = start;
      existing.end_date = end;
      existing.time = $('#f-time').value;
      existing.title = $('#f-title').value;
      existing.description = $('#f-desc').value;
      existing.repeat = repeat;
      existing.repeat_until = until;
      await dbPut('schedules', existing);
    }
    closeModal(); toast('스케줄이 수정되었습니다'); await renderSchedule();
    if (backDs) openDay(backDs);
  } else {
    await dbAdd('schedules', { date: start, end_date: end, time: $('#f-time').value, title: $('#f-title').value, description: $('#f-desc').value, completed: 0, repeat, repeat_until: until });
    closeModal(); toast('스케줄이 저장되었습니다'); renderPage();
  }
};

window.scheduleDeleteFromEdit = async function() {
  const idRaw = $('#f-id') && $('#f-id').value;
  const id = idRaw ? parseInt(idRaw) : null;
  const backDs = $('#f-back') && $('#f-back').value;
  if (!id) return;
  const target = await dbGet('schedules', id);
  if (target && SCHED_REPEAT[target.repeat]) { schedAskDelete(id, backDs || currentDate, !!backDs); return; }
  if (!confirm('이 일정을 삭제하시겠습니까?')) return;
  await dbDelete('schedules', id);
  closeModal(); toast('삭제되었습니다'); await renderSchedule();
  if (backDs) openDay(backDs);
};

// === 설정 옮기기 (사파리 ↔ 홈 화면 앱, 다른 기기) ===
// 아이폰·아이패드의 홈 화면 앱은 사파리와 저장 공간이 따로라서 Firebase 설정과 로그인이 넘어오지 않는다.
// 쓰던 쪽에서 '설정 복사' → 새로 쓰는 쪽에서 '설정 붙여넣기'로 Firebase 설정과 OAuth 클라이언트 ID를 한 번에 옮긴다.
// (이 두 값은 비밀번호가 아니라 앱 주소 같은 공개 식별값이다. 기록을 볼 수 있는지는 Google 로그인이 결정한다)
const SETUP_PREFIX = 'MYLIFE1:';
function appStandalone() { return !!(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone); }
function cloudSetupCode() {
  const cfg = cloudGetConfig();
  if (!cfg) return '';
  return SETUP_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify({ c: cfg, i: cloudGetClientId() }))));
}
function cloudReadSetupCode(text) {
  const m = (text || '').replace(/\s+/g, '').match(/MYLIFE1:([A-Za-z0-9+/=]+)/);
  if (!m) return null;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    return (o && o.c && typeof o.c === 'object' && o.c.apiKey && o.c.projectId) ? o : null;
  } catch (e) { return null; }
}
window.cloudCopySetup = async function() {
  const code = cloudSetupCode();
  if (!code) { toast('먼저 Firebase 설정을 저장하세요'); return; }
  let copied = false;
  try { await navigator.clipboard.writeText(code); copied = true; } catch (e) {}
  const out = $('#setup-code-out');
  if (out) {
    out.value = code;
    out.style.display = 'block';
    if (!copied) { out.focus(); out.select(); }
  }
  toast(copied ? '설정을 복사했습니다. 새로 쓸 곳에서 붙여넣으세요' : '아래 코드를 길게 눌러 전체 복사하세요');
};
window.cloudPasteSetup = async function() {
  const input = $('#setup-code-in');
  let text = (input && input.value || '').trim();
  if (!text) { try { text = (await navigator.clipboard.readText()) || ''; } catch (e) { text = ''; } }
  const got = cloudReadSetupCode(text);
  if (!got) {
    if (currentPage !== 'backup') { currentPage = 'backup'; $$('.tab-item').forEach(t => t.classList.remove('active')); await renderPage(); }
    const box = $('#setup-code-in');
    if (box) { box.scrollIntoView({ block: 'center' }); box.focus(); }
    toast(text.trim() ? '설정 코드가 아닙니다. 쓰던 곳에서 "설정 복사"를 다시 눌러주세요' : '복사한 코드를 아래 칸에 붙여넣고 다시 눌러주세요');
    return;
  }
  const same = JSON.stringify(cloudGetConfig()) === JSON.stringify(got.c);
  cloudSetConfig(got.c);
  if (got.i) cloudSetClientId(got.i);
  if (fbApp && !same) { location.reload(); return; } // 이미 다른 설정으로 연결돼 있으면 새로 시작해야 적용된다
  const ok = await cloudInit();
  await renderPage();
  if (!ok) { toast('설정은 저장했지만 연결하지 못했습니다. 인터넷 연결을 확인해주세요'); return; }
  if (cloudEnabled()) { toast('설정을 가져왔습니다'); return; }
  toast('설정을 가져왔습니다. 이제 Google로 로그인하세요');
  if (appStandalone() && cloudGetClientId()) cloudSignIn(); // 홈 화면 앱: 로그인 창을 바로 띄운다
};

// 같은 날짜의 노트 중 '내용이 더 최신 노트 안에 거의 그대로 들어 있는 것'만 이전 저장본으로 본다.
// 정리한 항목은 이 기기 보관함(meta 저장소)에 30일 동안 남겨 되돌릴 수 있다.
const SE_COVER = 0.9;      // 글·필기의 90% 이상이 최신본에 들어 있어야 이전 저장본으로 본다
const SE_TRASH_DAYS = 30;
const SE_MASK_W = 256, SE_MASK_H = 512;
let seDupCache = { sig: null, groups: [] };

function seNorm(s) { return (s || '').replace(/\s+/g, ''); }
// 이전본의 제목·설교자·본문(a)이 최신본(b)과 같은 노트의 것으로 볼 수 있는가
function seFieldOk(a, b) {
  if (!a || a === b) return true;
  if (!b) return false; // 이전본에만 적혀 있는 정보가 있으면 지우지 않는다
  const [s, l] = a.length <= b.length ? [a, b] : [b, a];
  return l.startsWith(s.slice(0, -1)); // 입력 중이던 마지막 글자(한글 조합)는 달라도 된다
}
function seDigest(r) {
  const pages = parsePages(r.content);
  const text = seNorm(pages.map(p => stripHTML(p.text || '')).join(''));
  const grams = new Set();
  for (let i = 0; i < text.length - 1; i++) grams.add(text.substr(i, 2));
  const title = seNorm(r.title);
  return {
    r, pages, text, grams,
    title: title === seNorm('(제목 없음)') ? '' : title,
    preacher: seNorm(r.preacher), reference: seNorm(r.reference),
    t: r.updated_at || r.created_at || '',
  };
}
// a의 글이 b의 글 안에 (거의) 그대로 들어 있는가
function seTextCovered(a, b) {
  // 이어서 쓴 경우: b가 a로 시작한다 (입력 중이던 마지막 글자는 달라도 된다)
  if (!a.text || b.text.startsWith(a.text.slice(0, -1))) return true;
  if (a.text.length < 8) return false; // 짧은 글은 위 경우가 아니면 다른 노트로 본다
  // 중간을 고쳐 쓴 경우: 두 글자씩 끊은 조각이 얼마나 겹치는지로 판단 (오타 두어 개 수정은 허용)
  let hit = 0;
  a.grams.forEach(g => { if (b.grams.has(g)) hit++; });
  const n = a.grams.size, miss = n - hit;
  return miss <= Math.max(4, Math.floor(n * (1 - SE_COVER))) && hit >= n * 0.6;
}
function seInkMask(url, cache) {
  if (!cache.has(url)) cache.set(url, new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = SE_MASK_W; c.height = SE_MASK_H;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, SE_MASK_W, SE_MASK_H);
        const px = ctx.getImageData(0, 0, SE_MASK_W, SE_MASK_H).data;
        const mask = new Uint8Array(SE_MASK_W * SE_MASK_H);
        for (let i = 0; i < mask.length; i++) mask[i] = px[i * 4 + 3] > 12 ? 1 : 0;
        resolve(mask);
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  }));
  return cache.get(url);
}
// 필기 a가 필기 b 안에 얼마나 들어 있는가 (0~1). 읽지 못한 필기는 '다른 것'으로 보고 남긴다.
async function seInkIn(a, b, cache) {
  if (a === b) return 1;
  const [ma, mb] = await Promise.all([seInkMask(a, cache), seInkMask(b, cache)]);
  if (!ma || !mb) return 0;
  let n = 0, hit = 0;
  for (let i = 0; i < ma.length; i++) if (ma[i]) { n++; if (mb[i]) hit++; }
  return n ? hit / n : 1;
}
// a가 b(더 최신)의 이전 저장본인가
async function seIsOldCopy(a, b, cache) {
  if (!seFieldOk(a.title, b.title) || !seFieldOk(a.preacher, b.preacher) || !seFieldOk(a.reference, b.reference)) return false;
  if (!seTextCovered(a, b)) return false;
  for (let i = 0; i < a.pages.length; i++) {
    const d = a.pages[i].drawing;
    if (!d) continue;
    // 같은 쪽을 먼저 보고, 없으면 다른 쪽에서 찾는다 (쪽 삭제로 번호가 밀린 경우)
    const cands = [b.pages[i]].concat(b.pages.filter((_, k) => k !== i)).filter(pg => pg && pg.drawing);
    let ok = false;
    for (const pg of cands) {
      if (await seInkIn(d, pg.drawing, cache) >= SE_COVER) { ok = true; break; }
    }
    if (!ok) return false;
  }
  return true;
}
// 결과: [{ keep: 남길 최신본, olds: [이전 저장본…] }]
async function seFindOldCopies() {
  const all = (await dbGetAll('sermons')).filter(r => !r.restored); // 사용자가 되돌린 항목은 다시 묻지 않는다
  const sig = all.map(r => (r.uuid || r.id) + ':' + (r.updated_at || '')).sort().join('|');
  if (seDupCache.sig === sig) return seDupCache.groups;
  const byDate = new Map();
  all.forEach(r => { const k = r.date || ''; if (!byDate.has(k)) byDate.set(k, []); byDate.get(k).push(r); });
  const cache = new Map();
  const groups = [];
  for (const list of byDate.values()) {
    if (list.length < 2) continue;
    const ds = list.map(seDigest).sort((x, y) => x.t.localeCompare(y.t) || String(x.r.uuid || '').localeCompare(String(y.r.uuid || '')));
    const newer = new Map(); // 이전본 → 그 내용을 담고 있는 더 최신본
    for (let i = 0; i < ds.length; i++) {
      for (let j = i + 1; j < ds.length; j++) {
        if (await seIsOldCopy(ds[i], ds[j], cache)) { newer.set(ds[i], ds[j]); break; }
      }
    }
    const byKeep = new Map();
    ds.forEach(d => {
      if (!newer.has(d)) return;
      let k = d;
      while (newer.has(k)) k = newer.get(k);
      if (!byKeep.has(k)) byKeep.set(k, []);
      byKeep.get(k).push(d.r);
    });
    byKeep.forEach((olds, k) => groups.push({ keep: k.r, olds }));
  }
  seDupCache = { sig, groups };
  return groups;
}
async function seTrashList() {
  const all = (await dbGetAll('meta')).filter(m => m && m.kind === 'trash' && m.store === 'sermons');
  const limit = new Date(Date.now() - SE_TRASH_DAYS * 86400000).toISOString();
  const keep = [];
  for (const m of all) {
    if ((m.removed_at || '') < limit) await dbDeleteLocal('meta', m.id); // 보관 기간이 지난 것
    else keep.push(m);
  }
  return keep;
}
async function seDedupeBanner() {
  let groups = [], trash = [];
  try { groups = await seFindOldCopies(); trash = await seTrashList(); } catch (e) { console.warn('중복 검사 실패', e); }
  const box = $('#se-dedupe');
  if (!box) return;
  const n = groups.reduce((sum, g) => sum + g.olds.length, 0);
  let html = '';
  if (n) html += `<div class="card" style="border:1px solid var(--primary);background:var(--primary-light)">
      <div style="font-size:14px;line-height:1.6">같은 노트의 <b>이전 자동저장본 ${n}개</b>가 목록에 함께 보이고 있습니다.<br>각 노트의 최신본만 남기고 정리할 수 있어요.</div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="seCleanOldCopies()">정리하기</button>
    </div>`;
  if (trash.length) html += `<div style="font-size:12px;color:var(--text-secondary);margin:0 4px 12px">정리한 이전 저장본 ${trash.length}개 보관 중 (${SE_TRASH_DAYS}일) · <a href="#" style="color:var(--primary)" onclick="seRestoreOldCopies();return false">되돌리기</a></div>`;
  box.innerHTML = html;
}
window.seCleanOldCopies = async function() {
  if (cloudGetConfig() && !cloudEnabled()) { toast('클라우드에 로그인한 뒤 정리해주세요'); return; }
  if (cloudPendingPulls > 0) { toast('동기화 중입니다. 잠시 후 다시 눌러주세요'); return; }
  const groups = await seFindOldCopies();
  const n = groups.reduce((sum, g) => sum + g.olds.length, 0);
  if (!n) { toast('정리할 항목이 없습니다'); renderSermons(); return; }
  if (!confirm(`같은 노트의 이전 자동저장본 ${n}개를 정리할까요?\n\n· 각 노트의 최신본은 그대로 남습니다.\n· 정리한 것은 이 기기에 ${SE_TRASH_DAYS}일 동안 보관되어 되돌릴 수 있습니다.`)) return;
  const now = new Date().toISOString();
  let done = 0;
  for (const g of groups) {
    for (const r of g.olds) {
      const cur = await dbGet('sermons', r.id);
      if (!cur || cur.uuid !== r.uuid || cur.updated_at !== r.updated_at) continue; // 검사 뒤에 바뀐 항목은 건드리지 않는다
      await dbPut('meta', { id: 'trash:sermons:' + (cur.uuid || cur.id), kind: 'trash', store: 'sermons', removed_at: now, item: cur });
      await dbDeleteLocal('sermons', cur.id);
      cloudRemoveForGood('sermons', cur.uuid);
      done++;
    }
  }
  seDupCache.sig = null;
  toast(`이전 저장본 ${done}개를 정리했습니다`);
  renderSermons();
};
window.seRestoreOldCopies = async function() {
  const trash = await seTrashList();
  if (!trash.length) { renderSermons(); return; }
  if (!confirm(`정리했던 이전 저장본 ${trash.length}개를 목록에 다시 넣을까요?`)) return;
  for (const m of trash) {
    const item = Object.assign({}, m.item, { restored: 1 });
    delete item.id; delete item.uuid; // 새 항목으로 되살린다 (예전 고유번호는 정리 기록에 남아 있음)
    await dbAdd('sermons', item);
    await dbDeleteLocal('meta', m.id);
  }
  seDupCache.sig = null;
  toast(`${trash.length}개를 되돌렸습니다`);
  renderSermons();
};

};

function setupSermonCanvas() {
  const canvas = $('#se-canvas');
  if (!canvas) return;
  const page = SE.pages[SE.cur];
  const W = canvas.parentElement.clientWidth;
  const H = parseInt(canvas.dataset.h);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (page.drawing) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, W, H); img.src = page.drawing; }
  canvas.style.pointerEvents = SE.pen ? 'auto' : 'none';

  let drawing = false, lx = 0, ly = 0;
  // 펜 위치 → 필기 판 좌표. 화면 크기(zoom)가 100%가 아니면 브라우저마다 위치 값을 알려주는 방식이 달라
  // (확대된 값으로 주는 브라우저와 확대 전 값으로 주는 브라우저가 있다) 두 경우를 모두 맞춘다.
  const pos = e => {
    const r = canvas.getBoundingClientRect(), z = uiZoomNow();
    const zoomed = Math.abs(r.width - W * z) <= Math.abs(r.width - W); // 확대된 값으로 알려주는 브라우저인가
    const left = zoomed ? r.left : r.left * z, top = zoomed ? r.top : r.top * z;
    return [(e.clientX - left) / z, (e.clientY - top) / z];
  };
  canvas.addEventListener('pointerdown', e => { if (!SE.pen) return; drawing = true; try { canvas.setPointerCapture(e.pointerId); } catch (x) {} [lx, ly] = pos(e); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const [x, y] = pos(e);
    ctx.globalCompositeOperation = SE.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = SE.color;
    ctx.lineWidth = SE.erase ? 22 : (e.pressure ? 1 + e.pressure * 3 : 2.5);
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
    [lx, ly] = [x, y];
  });
  const end = () => { if (drawing) { drawing = false; SE.pages[SE.cur].drawing = canvas.toDataURL('image/png'); seAutosave(); } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointerleave', end);
  canvas.addEventListener('pointercancel', end);
}

function seCapture() {
  const t = $('#se-text'); if (t) SE.pages[SE.cur].text = t.innerHTML;
  if ($('#se-title')) SE.title = $('#se-title').value;
  if ($('#se-date')) SE.date = $('#se-date').value;
  if ($('#se-preacher')) SE.preacher = $('#se-preacher').value;
  if ($('#f-ref')) SE.reference = $('#f-ref').value;
}

// 자동 저장 (작성 중 내용 손실 방지)
let seSaveTimer = null, seSaveChain = Promise.resolve();
function seAutosave() {
  clearTimeout(seSaveTimer);
  const st = $('#se-status'); if (st) st.textContent = '입력 중…';
  seSaveTimer = setTimeout(() => seSaveNow(false), 1000);
}
// 저장은 한 번에 하나씩 차례로 실행한다.
// (저장 도중에 닫아도 마지막 입력까지 저장되고, 새 노트가 두 번 추가되는 일이 없다)
function seSaveNow(showToast) {
  if (!SE) return Promise.resolve();
  seCapture();
  const se = SE;
  seSaveChain = seSaveChain.then(() => seWrite(se, showToast));
  return seSaveChain;
}
async function seWrite(se, showToast) {
  const empty = !(se.title || '').trim() && !(se.reference || '').trim() && !(se.preacher || '').trim()
    && se.pages.every(p => !stripHTML(p.text || '').trim() && !p.drawing);
  if (!se.id && empty) return;
  const data = {
    date: se.date, title: se.title || '(제목 없음)',
    preacher: se.preacher, reference: se.reference,
    content: serializePages(se.pages),
  };
  const setStatus = text => { const st = $('#se-status'); if (st && SE === se) st.textContent = text; };
  try {
    if (se.id) { data.id = se.id; await dbPut('sermons', data); }
    else { const created = await dbAdd('sermons', data); if (created && created.id) se.id = created.id; }
    setStatus('자동 저장됨');
    if (showToast) toast('설교노트가 저장되었습니다');
  } catch (e) {
    setStatus('저장 실패');
  }
}
window.seFlush = function() { if (!SE) return; clearTimeout(seSaveTimer); seSaveNow(false); };

window.sePen = function(on) {
  SE.pen = on; SE.erase = false;
  $('#se-canvas').style.pointerEvents = on ? 'auto' : 'none';
  const t = $('#se-text'); t.contentEditable = on ? 'false' : 'true'; t.style.pointerEvents = on ? 'none' : 'auto';
  $('#tool-pen').classList.toggle('active', on);
  $('#tool-type').classList.toggle('active', !on);
  $('#tool-erase').classList.remove('active');
};
window.seErase = function() {
  if (!SE.pen) sePen(true);
  SE.erase = !SE.erase;
  $('#tool-erase').classList.toggle('active', SE.erase);
};
window.seColor = function(c) {
  SE.color = c; SE.erase = false;
  $('#tool-erase').classList.remove('active');
  $$('.se-color').forEach(el => el.classList.toggle('active', el.dataset.c === c));
  if (SE.pen) return; // 필기 모드: 펜 색만 변경
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('foreColor', false, c);
};
window.seClearDraw = function() {
  if (!confirm('이 페이지의 필기를 지울까요?')) return;

window.seFontSize = function(dir) {
  if (!SE) return;
  const editable = document.getElementById('se-text');
  const sel = window.getSelection();
  if (!editable || !sel || !sel.rangeCount) { toast('먼저 크기를 바꿀 글씨를 드래그해서 선택하세요'); return; }
  const range = sel.getRangeAt(0);
  if (range.collapsed || !editable.contains(range.commonAncestorContainer)) {
    toast('먼저 크기를 바꿀 글씨를 드래그해서 선택하세요'); return;
  }
  // 선택 시작점 기준 현재 픽셀 크기 계산 → 한 단계 증감
  let refNode = range.startContainer;
  if (refNode.nodeType === Node.TEXT_NODE) refNode = refNode.parentElement;
  const curSize = Math.round(parseFloat(window.getComputedStyle(refNode).fontSize) || SE_FS_DEFAULT);
  const nextSize = Math.max(SE_FS_MIN, Math.min(SE_FS_MAX, curSize + dir * SE_FS_STEP));
  if (nextSize === curSize) { toast(dir > 0 ? '이미 최대 크기입니다' : '이미 최소 크기입니다'); return; }
  // 선택 영역을 꺼내 기존 font-size 지정을 모두 제거한 뒤 새 크기로 감싸기
  const frag = range.extractContents();
  const strip = (n) => {
    if (n.nodeType === Node.ELEMENT_NODE) {
      if (n.style && n.style.fontSize) n.style.fontSize = '';
      if (n.tagName === 'FONT' && n.hasAttribute('size')) n.removeAttribute('size');
      Array.from(n.childNodes).forEach(strip);
    }
  };
  Array.from(frag.childNodes).forEach(strip);
  const wrap = document.createElement('span');
  wrap.style.fontSize = nextSize + 'px';
  wrap.appendChild(frag);
  range.insertNode(wrap);
  // 선택 유지 → 연속으로 +/− 눌러 계속 조절 가능
  sel.removeAllRanges();
  const nr = document.createRange();
  nr.selectNodeContents(wrap);
  sel.addRange(nr);
  seCapture();
  seAutosave();
};

// 저장소의 날짜만 가볍게 읽는다 (내용은 읽지 않음)
async function dbDates(store) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const out = [];
    const req = db.transaction(store, 'readonly').objectStore(store).index('date').openKeyCursor();
    req.onsuccess = () => {
      const c = req.result;
      if (!c) { resolve(out); return; }
      if (typeof c.key === 'string') out.push(c.key);
      c.continue();
    };
    req.onerror = () => reject(req.error);
  });
}
// 날짜 이동. 그 달에 없는 날(예: 31일)은 clamp면 말일로, 아니면 null
function ymdShift(ymd, by, clamp) {
  const dt = new Date(ymd + 'T00:00:00');
  if (by.d) dt.setDate(dt.getDate() + by.d);
  const months = (by.m || 0) + (by.y || 0) * 12;
  if (months) {
    const day = dt.getDate();
    dt.setDate(1);
    dt.setMonth(dt.getMonth() + months);
    const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
    if (day > last && !clamp) return null;
    dt.setDate(Math.min(day, last));
  }
  return toLocalYMD(dt);
}
function spaceSnip(text, n) {
  const t = (text || '').replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n) + '…' : t;
}
function spaceDays(a, b) { // a에서 b까지 며칠
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
async function spaceActivity() { // 날짜 → 그날 남긴 기록 종류
  const byDate = new Map();
  for (const r of SPACE_REC) {
    for (const ds of await dbDates(r.store)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) continue;
      if (!byDate.has(ds)) byDate.set(ds, new Set());
      byDate.get(ds).add(r.label);
    }
  }
  return byDate;
}
function spaceStreak(byDate) {
  const today = toLocalYMD(new Date());
  // 오늘 아직 안 썼어도 어제까지의 연속은 끊기지 않은 것으로 본다
  let cur = 0, d = byDate.has(today) ? today : ymdShift(today, { d: -1 });
  while (byDate.has(d)) { cur++; d = ymdShift(d, { d: -1 }); }
  const days = [...byDate.keys()].filter(k => k <= today).sort();
  let best = 0, run = 0, prev = null;
  for (const k of days) {
    run = (prev && ymdShift(prev, { d: 1 }) === k) ? run + 1 : 1;
    if (run > best) best = run;
    prev = k;
  }
  return { cur, best, total: days.length, todayDone: byDate.has(today) };
}
function spaceMotto(memos) {
  return memos.filter(m => m.kind === 'motto').sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''))[0] || null;
}
function spaceGreeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return '좋은 아침이에요';
  if (h >= 11 && h < 17) return '좋은 오후예요';
  if (h >= 17 && h < 22) return '좋은 저녁이에요';
  return '오늘도 수고 많으셨어요';
}

  let cells = '', months = '', lastMonth = -1;
  for (let w = 0; w < SPACE_HEAT_WEEKS; w++) {

async function spaceBuildIndex() {
  const out = [];
  const add = (type, date, title, text, go) => {
    const full = ((title || '') + ' ' + (text || '')).replace(/\s+/g, ' ').trim();
    if (full) out.push({ type, date: date || '', title: title || '', text: full, low: full.toLowerCase(), go });
  };
  (await dbGetAll('diary')).forEach(x => add('일기', x.date, '', stripHTML(x.content) + ' ' + (x.gratitude || ''), { page: 'diary', date: x.date }));
  (await dbGetAll('scriptures')).forEach(x => add('말씀', x.date, x.reference, (x.verse || '') + ' ' + (x.reflection || ''), { page: 'scripture', date: x.date }));
  (await dbGetAll('prayers')).forEach(x => add('기도', x.date, '', stripHTML(x.content), { page: 'prayer', date: x.date }));
  (await dbGetAll('sermons')).forEach(x => add('설교노트', x.date, x.title, [x.preacher, x.reference].concat(parsePages(x.content).map(p => stripHTML(p.text || ''))).join(' '), { sermon: x.id }));
  (await dbGetAll('memos')).filter(x => !x.kind).forEach(x => add('메모', (x.updated_at || x.created_at || '').slice(0, 10), x.title, stripHTML(x.content), { memo: x.id }));
  (await dbGetAll('ideas')).forEach(x => add('아이디어', (x.created_at || '').slice(0, 10), x.title, x.content, { nav: 'ideas' }));
  (await dbGetAll('plans')).forEach(x => add('계획', x.target_date, x.title, x.category, { nav: 'plans' }));
  (await dbGetAll('schedules')).forEach(x => add('스케줄', x.date, x.title, x.description, { schedule: x.date }));
  return out;
}

async function spaceRunSearch() {
  const input = $('#space-q'), box = $('#space-results');

  const q = input.value.trim().toLowerCase();
  if (q.length < 2) { box.innerHTML = q ? '<div class="item-meta" style="margin-top:10px">두 글자 이상 입력하세요</div>' : ''; return; }

    spaceHits.map((e, i) => {

      return `<div class="sp-hit" onclick="spaceGo(${i})">

// 기기마다 따로 기억한다. 100%가 기본 크기이고, 처음 값은 홈 화면 앱 100% · 브라우저 115%.
const UI_ZOOMS = [0.85, 0.92, 1, 1.08, 1.15, 1.25];
function uiZoomNow() {
  const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui-zoom'));
  return (z >= 0.7 && z <= 1.5) ? z : 1.15;
}
function uiZoomLabel() {
  const el = document.getElementById('ui-zoom-label');
  if (el) el.textContent = Math.round(uiZoomNow() * 100) + '%';
}
window.uiZoomStep = function(dir) {
  const cur = uiZoomNow();
  let i = 0;
  UI_ZOOMS.forEach((z, k) => { if (Math.abs(z - cur) < Math.abs(UI_ZOOMS[i] - cur)) i = k; });
  const next = UI_ZOOMS[Math.max(0, Math.min(UI_ZOOMS.length - 1, i + dir))];
  if (next === cur) { toast(dir > 0 ? '가장 큰 크기입니다' : '가장 작은 크기입니다'); return; }
  document.documentElement.style.setProperty('--ui-zoom', String(next));
  try { localStorage.setItem('uiZoom', String(next)); } catch (e) {}
  uiZoomLabel();
  // 크기가 바뀌면 화면을 다시 그린다 (설교노트 필기 판은 크기에 맞춰 새로 만들어야 한다)
  if (SE && document.getElementById('se-text')) { seCapture(); renderSermonEditor(); }
  else if (!editorOpen()) renderPage();
};

// 작성 중인 것이 없을 때는 바로 새로 고친다. 그 밖에는 아래쪽에 작은 안내를 띄우고,
// 화면을 한동안 건드리지 않으면(작성 중이 아닐 때) 알아서 적용한다. 안내를 눌러 바로 적용할 수도 있다.
let appUpdateReady = false, appReloading = false, appSeenAt = Date.now();
const APP_IDLE_MS = 2 * 60 * 1000;       // 이만큼 손대지 않으면 새 버전을 알아서 적용
const APP_CHECK_MS = 10 * 60 * 1000;     // 켜 둔 화면에서 새 버전을 확인하는 간격
let appTouchedAt = Date.now();           // 마지막으로 화면을 건드린 때
['pointerdown', 'keydown', 'touchstart', 'wheel', 'input'].forEach(type => {
  document.addEventListener(type, () => { appTouchedAt = Date.now(); }, { passive: true, capture: true });
});
window.addEventListener('scroll', () => { appTouchedAt = Date.now(); }, { passive: true });
// 새 버전이 준비돼 있고, 화면이 보이고, 작성 중이 아니고, 한동안 손대지 않았으면 적용한다
function appApplyWhenIdle() {
  if (!appUpdateReady || appReloading || document.hidden || appBusy()) return false;
  if (Date.now() - appTouchedAt < APP_IDLE_MS) return false;
  appReload();
  return true;
}
function appBusy() { // 작성 중인 화면이나 창이 열려 있는가
  return editorOpen() || $('#modalOverlay').classList.contains('active');
}
async function appReload() {
  if (appReloading) return;
  appReloading = true;
  try { await seSaveChain; } catch (e) {}                                              // 설교노트 저장이 끝난 뒤
  for (let i = 0; i < 30 && meSaving; i++) await new Promise(r => setTimeout(r, 100)); // 메모 저장이 끝난 뒤
  try { sessionStorage.setItem('appResume', JSON.stringify({ page: currentPage, date: currentDate })); } catch (e) {} // 보던 화면으로 돌아오기
  location.reload();
}
function appUpdateFound() {
  appUpdateReady = true;
  if (!appBusy() && Date.now() - appSeenAt < 8000) { appReload(); return; }
  if (document.getElementById('app-update')) return;
  const bar = document.createElement('div');
  bar.id = 'app-update';
  bar.className = 'app-update';
  bar.innerHTML = '<span>새 버전이 준비됐어요</span><button onclick="appApplyUpdate()">적용</button>';
  document.body.appendChild(bar);
}
window.appApplyUpdate = function() {
  if (appBusy()) { toast('작성 중인 내용을 저장하거나 닫은 뒤 눌러주세요'); return; }
  appReload();
};
function appCheckUpdate() {
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (sw) sw.postMessage({ type: 'check-update' });
}

if ('serviceWorker' in navigator) {
  let appSwReg = null;
  navigator.serviceWorker.register('./sw.js').then(reg => { appSwReg = reg; }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'app-updated') appUpdateFound(); });
  // 앱으로 돌아올 때마다 새 버전을 확인한다 (홈 화면 앱은 껐다 켜지 않고 이어서 쓰는 일이 많다)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    appSeenAt = Date.now();
    if (appUpdateReady) { if (!appBusy()) appReload(); return; }
    appCheckUpdate();
    if (appSwReg) appSwReg.update().catch(() => {});
  });
  setInterval(() => { if (!document.hidden && !appUpdateReady) appCheckUpdate(); }, APP_CHECK_MS); // 켜 둔 화면에서도 주기적으로 확인
  setInterval(appApplyWhenIdle, 20 * 1000); // 손대지 않고 있으면 알아서 적용
}
</script>
</body>
