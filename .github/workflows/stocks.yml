# 증권 차트에 쓰는 시세(stocks-data.json)를 하루 몇 번 받아서 저장소에 올린다.
# 시간은 UTC 기준이다 (한국 시간 = UTC + 9시간).
name: 증권 시세 받기

on:
  schedule:
    - cron: '10 22 * * 1-5'   # 한국 화~토 07:10 — 미국 장 마감 뒤
    - cron: '30 1,4 * * 1-5'  # 한국 월~금 10:30, 13:30 — 한국 장중
    - cron: '0 7 * * 1-5'     # 한국 월~금 16:00 — 한국 장 마감 뒤
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stocks-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 시세 받기
        run: python3 tools/fetch_stocks.py
      - name: 바뀐 내용 올리기
        run: |
          if [ -z "$(git status --porcelain -- stocks-data.json)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks-data.json
          git commit -m "증권 시세 갱신"
          git pull --rebase origin main
          git push
